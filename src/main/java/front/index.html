



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>



<title>School Management System</title>

<!-- Bootstrap 5 -->
<link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
>

<!-- Bootstrap Icons -->
<link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<style>

    body {
        background: #f4f6f9;
        font-family: Arial, Helvetica, sans-serif;
    }

    .navbar {
        background: linear-gradient(135deg, #0d6efd, #084298);
    }

    .navbar-brand {
        font-weight: bold;
        font-size: 22px;
    }

    .page-title {
        font-weight: 700;
        color: #212529;
    }

    .card {
        border: none;
        border-radius: 14px;
    }

    .card-header {
        background: white;
        border-bottom: 1px solid #eee;
    }

    .table {
        margin-bottom: 0;
    }

    .table th {
        white-space: nowrap;
        font-size: 14px;
    }

    .table td {
        vertical-align: middle;
        font-size: 14px;
    }

    .school-name {
        font-weight: 600;
    }

    .location {
        color: #555;
    }

    .status-active {
        background: #d1e7dd;
        color: #0f5132;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
    }

    .status-inactive {
        background: #f8d7da;
        color: #842029;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
    }

    .action-btn {
        width: 35px;
        height: 35px;
        padding: 0;
        display: inline-flex;
        justify-content: center;
        align-items: center;
    }

    .empty-state {
        text-align: center;
        padding: 50px;
        color: #777;
    }

    .empty-state i {
        font-size: 45px;
        display: block;
        margin-bottom: 10px;
    }

    .modal-content {
        border: none;
        border-radius: 15px;
    }

    .form-control {
        border-radius: 8px;
    }

    .btn {
        border-radius: 8px;
    }

    .search-card {
        background: white;
    }

    footer {
        color: #777;
        font-size: 13px;
    }

</style>

</head> <body> <!-- ===================================================== NAVBAR ===================================================== --> <nav class="navbar navbar-dark shadow-sm">
    <div class="container">

    <span class="navbar-brand">
        <i class="bi bi-building"></i>
        School Management System
    </span>

    </div>

</nav> <!-- ===================================================== MAIN CONTENT ===================================================== --> <div class="container py-4">
    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Schools
            </h2>

            <p class="text-muted mb-0">
                Manage all schools in the system
            </p>

        </div>

        <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addSchoolModal">

            <i class="bi bi-plus-lg"></i>
            Add School

        </button>

    </div>

    <!-- =====================================================
         ALERT
    ====================================================== -->

    <div id="alertBox"></div>

    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <div class="card search-card shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3 align-items-end">

                <div class="col-md-5">

                    <label class="form-label fw-semibold">
                        Search School by ID
                    </label>

                    <input
                            type="number"
                            id="searchId"
                            class="form-control"
                            placeholder="Enter school ID">

                </div>

                <div class="col-md-7">

                    <button
                            class="btn btn-primary me-2"
                            onclick="getSchoolById()">

                        <i class="bi bi-search"></i>
                        Search

                    </button>

                    <button
                            class="btn btn-secondary"
                            onclick="loadSchools()">

                        <i class="bi bi-arrow-clockwise"></i>
                        Show All

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- =====================================================
         SCHOOL TABLE
    ====================================================== -->

    <div class="card shadow-sm">

        <div class="card-header py-3">

            <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0">

                    <i class="bi bi-list-ul text-primary"></i>

                    School List

                </h5>

                <span
                        class="badge bg-primary"
                        id="schoolCount">

                0 Schools

            </span>

            </div>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th class="ps-4">
                            ID
                        </th>

                        <th>
                            School Name
                        </th>

                        <th>
                            Location
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Created Date
                        </th>

                        <th>
                            Updated Date
                        </th>

                        <th class="text-center">
                            Actions
                        </th>

                    </tr>

                    </thead>

                    <tbody id="schoolTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer class="text-center mt-4">

        School Management System © 2026

    </footer>

</div> <!-- ===================================================== ADD SCHOOL MODAL ===================================================== --> <div class="modal fade" id="addSchoolModal" tabindex="-1">
    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-plus-circle text-primary"></i>

                    Add School

                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        School Name
                    </label>

                    <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Example: JBZ">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                            type="text"
                            id="schoolLocation"
                            class="form-control"
                            placeholder="Example: Muscat">

                </div>

            </div>

            <div class="modal-footer">

                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                        class="btn btn-primary"
                        onclick="addSchool()">

                    <i class="bi bi-save"></i>

                    Save School

                </button>

            </div>

        </div>

    </div>

</div> <!-- ===================================================== UPDATE SCHOOL MODAL ===================================================== --> <div class="modal fade" id="editSchoolModal" tabindex="-1">
    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-pencil-square text-primary"></i>

                    Update School

                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input
                        type="hidden"
                        id="editSchoolId">

                <div class="mb-3">

                    <label class="form-label">
                        School Name
                    </label>

                    <input
                            type="text"
                            id="editname"
                            class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                            type="text"
                            id="editSchoolLocation"
                            class="form-control">

                </div>

            </div>

            <div class="modal-footer">

                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                        class="btn btn-success"
                        onclick="updateSchool()">

                    <i class="bi bi-check-lg"></i>

                    Update School

                </button>

            </div>

        </div>

    </div>

</div> <!-- ===================================================== BOOTSTRAP JAVASCRIPT ===================================================== --> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script> <!-- ===================================================== JAVASCRIPT ===================================================== --> <script>
    // =====================================================
    // API URL
    // =====================================================

    const API_URL = "http://localhost:8080/s";

    // =====================================================
    // LOAD ALL SCHOOLS
    // =====================================================

    async function loadSchools() {

        try {

            const response =
                await fetch(`${API_URL}/getAll`);

            if (!response.ok) {

                throw new Error(
                    "Failed to load schools"
                );

            }

            const schools =
                await response.json();

            displaySchools(schools);

        } catch (error) {

            console.error(error);

            showAlert(
                "Unable to connect to the backend server.",
                "danger"
            );

        }

    }

    // =====================================================
    // DISPLAY SCHOOLS
    // =====================================================

    function displaySchools(schools) {

        const tableBody =
            document.getElementById(
                "schoolTableBody"
            );

        const schoolCount =
            document.getElementById(
                "schoolCount"
            );

        tableBody.innerHTML = "";

        schoolCount.textContent =
            `${schools.length} School${schools.length !== 1 ? "s" : ""}`;

        if (schools.length === 0) {

            tableBody.innerHTML = `

            <tr>

                <td colspan="7">

                    <div class="empty-state">

                        <i class="bi bi-building"></i>

                        <strong>
                            No schools found
                        </strong>

                    </div>

                </td>

            </tr>

        `;

            return;
        }

        schools.forEach(school => {

            const row =
                document.createElement("tr");

            const status =
                school.isActive

                    ? `
                <span class="status-active">
                    Active
                </span>
              `

                    : `
                <span class="status-inactive">
                    Inactive
                </span>
              `;

            row.innerHTML = `

            <td class="ps-4">

                <strong>
                    #${school.id}
                </strong>

            </td>

            <td>

                <span class="school-name">

                    ${escapeHtml(school.name)}

                </span>

            </td>

            <td>

                <span class="location">

                    <i class="bi bi-geo-alt text-danger"></i>

                    ${escapeHtml(school.location)}

                </span>

            </td>

            <td>

                ${status}

            </td>

            <td>

                ${formatDate(school.createdDate)}

            </td>

            <td>

                ${formatDate(school.updatedDate)}

            </td>

            <td class="text-center">

                <button

                    class="btn btn-outline-primary action-btn me-1"

                    onclick="openEditModal(
                        ${school.id},
                        '${escapeForJs(school.name)}',
                        '${escapeForJs(school.location)}'
                    )"

                    title="Edit">

                    <i class="bi bi-pencil"></i>

                </button>

                <button

                    class="btn btn-outline-danger action-btn"

                    onclick="deleteSchool(${school.id})"

                    title="Delete">

                    <i class="bi bi-trash"></i>

                </button>

            </td>

        `;

            tableBody.appendChild(row);

        });

    }

    // =====================================================
    // ADD SCHOOL
    // =====================================================

    async function addSchool() {

        const name =
            document
                .getElementById("name")
                .value
                .trim();

        const location =
            document
                .getElementById("schoolLocation")
                .value
                .trim();

        if (!name || !location) {

            showAlert(
                "Please enter school name and location.",
                "warning"
            );

            return;
        }

        try {

            const url =
                `${API_URL}/add?name=${encodeURIComponent(name)}&location=${encodeURIComponent(location)}`;

            const response =
                await fetch(url, {
                    method: "POST"
                });

            if (!response.ok) {

                throw new Error(
                    "Failed to add school"
                );

            }

            const result =
                await response.text();

            console.log(
                "Add response:",
                result
            );

            document.getElementById(
                "name"
            ).value = "";

            document.getElementById(
                "schoolLocation"
            ).value = "";

            const modal =
                bootstrap.Modal.getInstance(
                    document.getElementById(
                        "addSchoolModal"
                    )
                );

            modal.hide();

            showAlert(
                "School added successfully!",
                "success"
            );

            loadSchools();

        } catch (error) {

            console.error(error);

            showAlert(
                "Failed to add school.",
                "danger"
            );

        }

    }

    // =====================================================
    // GET SCHOOL BY ID
    // =====================================================

    async function getSchoolById() {

        const id =
            document
                .getElementById("searchId")
                .value
                .trim();

        if (!id) {

            showAlert(
                "Please enter a school ID.",
                "warning"
            );

            return;
        }

        try {

            const response =
                await fetch(
                    `${API_URL}/getById?id=${id}`
                );

            if (!response.ok) {

                throw new Error(
                    "Failed to find school"
                );

            }

            const school =
                await response.json();

            /*
             * Your API returns:
             *
             * {
             *   "id": null,
             *   ...
             * }
             *
             * when the school does not exist.
             */

            if (school.id === null) {

                showAlert(
                    `School with ID ${id} was not found.`,
                    "warning"
                );

                return;
            }

            displaySchools([school]);

        } catch (error) {

            console.error(error);

            showAlert(
                "Failed to search for school.",
                "danger"
            );

        }

    }

    // =====================================================
    // OPEN UPDATE MODAL
    // =====================================================

    function openEditModal(
        id,
        name,
        location
    ) {

        document.getElementById(
            "editSchoolId"
        ).value = id;

        document.getElementById(
            "editname"
        ).value = name;

        document.getElementById(
            "editSchoolLocation"
        ).value = location;

        const modal =
            new bootstrap.Modal(
                document.getElementById(
                    "editSchoolModal"
                )
            );

        modal.show();

    }

    // =====================================================
    // UPDATE SCHOOL
    // =====================================================

    async function updateSchool() {

        const id =
            document
                .getElementById(
                    "editSchoolId"
                )
                .value;

        const name =
            document
                .getElementById(
                    "editname"
                )
                .value
                .trim();

        const location =
            document
                .getElementById(
                    "editSchoolLocation"
                )
                .value
                .trim();

        if (!name || !location) {

            showAlert(
                "Please enter school name and location.",
                "warning"
            );

            return;
        }

        try {

            const url =
                `${API_URL}/update?id=${id}&name=${encodeURIComponent(name)}&location=${encodeURIComponent(location)}`;

            const response =
                await fetch(url, {
                    method: "PUT"
                });

            if (!response.ok) {

                throw new Error(
                    "Failed to update school"
                );

            }

            const updatedSchool =
                await response.json();

            console.log(
                "Updated:",
                updatedSchool
            );

            const modal =
                bootstrap.Modal.getInstance(
                    document.getElementById(
                        "editSchoolModal"
                    )
                );

            modal.hide();

            showAlert(
                "School updated successfully!",
                "success"
            );

            loadSchools();

        } catch (error) {

            console.error(error);

            showAlert(
                "Failed to update school.",
                "danger"
            );

        }

    }

    // =====================================================
    // DELETE SCHOOL
    // =====================================================

    async function deleteSchool(id) {

        const confirmed =
            confirm(
                `Are you sure you want to delete school #${id}?`
            );

        if (!confirmed) {

            return;

        }

        try {

            const response =
                await fetch(
                    `${API_URL}/delete?id=${id}`,
                    {
                        method: "DELETE"
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }

            const result =
                await response.text();

            console.log(
                "Delete response:",
                result
            );

            if (
                result.toLowerCase() === "true"
            ) {

                showAlert(
                    "School deleted successfully!",
                    "success"
                );

                loadSchools();

            } else {

                showAlert(
                    "Unable to delete school.",
                    "danger"
                );

            }

        } catch (error) {

            console.error(error);

            showAlert(
                "Failed to delete school.",
                "danger"
            );

        }

    }

    // =====================================================
    // SHOW ALERT
    // =====================================================

    function showAlert(
        message,
        type
    ) {

        const alertBox =
            document.getElementById(
                "alertBox"
            );

        alertBox.innerHTML = `

        <div
            class="alert alert-${type} alert-dismissible fade show"
            role="alert">

            ${message}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>

    `;

        setTimeout(() => {

            const alert =
                alertBox.querySelector(
                    ".alert"
                );

            if (alert) {

                const bsAlert =
                    bootstrap.Alert
                        .getOrCreateInstance(
                            alert
                        );

                bsAlert.close();

            }

        }, 4000);

    }

    // =====================================================
    // FORMAT DATE
    // =====================================================

    function formatDate(date) {

        if (!date) {

            return "-";

        }

        return new Date(date)
            .toLocaleString();

    }

    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

    // =====================================================
    // ESCAPE JAVASCRIPT STRING
    // =====================================================

    function escapeForJs(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'");

    }

    // =====================================================
    // LOAD DATA WHEN PAGE OPENS
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadSchools();

        }
    );

</script> </body> </html>
